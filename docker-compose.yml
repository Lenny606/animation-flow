

services:
  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
        - VITE_DISABLE_AUTH=${VITE_DISABLE_AUTH:-true}
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  mongodb:
    image: mongo:latest
    command: ["mongod", "--quiet"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:

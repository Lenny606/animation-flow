version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - ENV=development
      - PORT=8000
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional database or cache
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"

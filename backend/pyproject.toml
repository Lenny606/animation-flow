[project]
name = "animation-flow-api"
version = "0.1.0"
description = "FastAPI app with LangChain, LangGraph, MongoDB, and Redis"
authors = [
    {name = "Tomas", email = "thomas.kravcik@gmail.com"},
]
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.41.0",
    "motor>=3.7.1",
    "redis>=5.0.0",
    "pydantic-settings>=2.13.0",
    "sentry-sdk[fastapi]>=2.53.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "email-validator>=2.2.0",
    "slowapi>=0.1.9",
    "aiosmtplib>=3.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "fakeredis>=2.20.0",
    "langchain-core (>=1.2.19,<2.0.0)",
    "langchain-google-genai (>=4.2.1,<5.0.0)",
]
requires-python = ">=3.11"

[tool.poetry]
name = "ai-orchestration-app"
version = "0.1.0"
description = "FastAPI app with LangChain, LangGraph, MongoDB, and Redis"
authors = ["Tomas <tomas@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.129.0"
uvicorn = {extras = ["standard"], version = "^0.41.0"}
motor = "^3.7.1"
redis = "^5.0.0"
pydantic-settings = "^2.13.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.53.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
python-multipart = "^0.0.22"
loguru = "^0.7.3"
python-dotenv = "^1.2.1"
email-validator = "^2.2.0"
slowapi = "^0.1.9"
aiosmtplib = "^3.0.0"
httpx = ">=0.28.1"
aiohttp = "^3.9.0"
fakeredis = "^2.20.0"
langchain = "^1.2.12"
langchain-google-genai = "^4.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"

[tool.uv]
package = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

